# Aggiorna web app, worker e database sulla VM Oracle Always Free a ogni push su main.
# Si attiva solo dopo aver impostato la variabile VM_HOST e i secret VM_SSH_KEY,
# POSTGRES_PASSWORD, BETTER_AUTH_SECRET, ENCRYPTION_KEY, INGESTION_WEBHOOK_SECRET e
# AI_GATEWAY_API_KEY. Vedi README → "Deployment".
name: Deploy backend

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', LICENSE]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.VM_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP: openvitals
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER || 'ubuntu' }}
      API_HOST: ${{ vars.API_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Chiave SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm && chmod 600 ~/.ssh/id_vm
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
      - name: Configurazione dell'app
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          INGESTION_WEBHOOK_SECRET: ${{ secrets.INGESTION_WEBHOOK_SECRET }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_DEFAULT_MODEL: ${{ vars.AI_DEFAULT_MODEL }}
          BLOB_STORAGE_PROVIDER: ${{ vars.BLOB_STORAGE_PROVIDER }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_WEBHOOK_SECRET: ${{ secrets.WHOOP_WEBHOOK_SECRET }}
          INTEGRATION_WEBHOOK_SECRET: ${{ secrets.INTEGRATION_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          [ -n "$API_HOST" ] || API_HOST="$APP.${VM_HOST//./-}.sslip.io"
          if [ "${#ENCRYPTION_KEY}" -ne 32 ]; then echo "::error::ENCRYPTION_KEY deve essere lunga esattamente 32 caratteri"; exit 1; fi
          umask 077
          : > deploy/.env
          put() { [ -z "$2" ] || printf "%s='%s'\n" "$1" "$2" >> deploy/.env; }
          put APP_URL "https://$API_HOST"
          for name in POSTGRES_PASSWORD BETTER_AUTH_SECRET ENCRYPTION_KEY INGESTION_WEBHOOK_SECRET \
            AI_GATEWAY_API_KEY AI_DEFAULT_MODEL BLOB_STORAGE_PROVIDER BLOB_READ_WRITE_TOKEN \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET WHOOP_CLIENT_ID WHOOP_CLIENT_SECRET WHOOP_WEBHOOK_SECRET \
            INTEGRATION_WEBHOOK_SECRET RESEND_API_KEY UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN; do
            put "$name" "${!name}"
          done
          printf '%s {\n\treverse_proxy openvitals-web:3000\n}\n' "$API_HOST" > deploy/site.caddy
          echo "Indirizzo dell'app: https://$API_HOST"
      - name: Copia sulla VM e avvia
        run: |
          SSH="ssh -i $HOME/.ssh/id_vm"
          $SSH "$VM_USER@$VM_HOST" "sudo mkdir -p /opt/apps/$APP && sudo chown \$USER /opt/apps/$APP"
          rsync -az --delete -e "$SSH" --exclude .git --exclude node_modules --exclude .next ./ "$VM_USER@$VM_HOST:/opt/apps/$APP/"
          $SSH "$VM_USER@$VM_HOST" "bash /opt/apps/$APP/deploy/remote-deploy.sh $APP"
      - name: Controllo
        run: |
          [ -n "$API_HOST" ] || API_HOST="$APP.${VM_HOST//./-}.sslip.io"
          for i in $(seq 1 40); do curl -fsS -o /dev/null "https://$API_HOST/" && echo "OK: https://$API_HOST" && exit 0; sleep 6; done
          echo "L'app non risponde su https://$API_HOST" && exit 1
